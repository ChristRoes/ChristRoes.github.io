<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familienplaner Christ - Supabase Edition</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --josefb: #ef4444;
            --heidi: #ec4899;
            --josefr: #10b981;
            --markus: #f59e0b;
            --alle: #6366f1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .container { grid-template-columns: 2fr 1fr; } .full-width { grid-column: span 2; } }
        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        h3, h4 { margin-bottom: 15px; color: #0f172a; border-bottom: 2px solid var(--border); padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 600; font-size: 0.9rem; }
        input, select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; width: 100%; }
        .time-row { display: flex; gap: 10px; align-items: center; }
        .time-select { width: 80px; }
        .minute-buttons { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
        .minute-btn { padding: 6px 12px; border: 1px solid var(--border); background: #f1f5f9; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
        .minute-btn:hover { background: #e2e8f0; }
        .minute-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; font-size: 1rem; transition: background 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: #ef4444; color: white; padding: 4px 8px; font-size: 0.8rem; }
        .calendar-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f1f5f9; padding: 10px; border-radius: 8px; }
        .view-switch { display: flex; gap: 5px; }
        .nav-buttons { display: flex; gap: 5px; }
        .view-btn, .nav-btn { padding: 6px 12px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .view-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .calendar-grid { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .grid-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #f1f5f9; text-align: center; font-weight: 600; padding: 8px 0; font-size: 0.9rem; }
        .grid-body { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--border); }
        .calendar-day { background: white; min-height: 90px; padding: 5px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: background 0.1s; position: relative; }
        .calendar-day:hover { background: #f8fafc; }
        .calendar-day.other-month { background: #f1f5f9; color: #94a3b8; }
        .calendar-day.today { background: #eff6ff; box-shadow: inset 0 0 0 2px var(--primary); }
        .calendar-day.selected { background: #f0fdf4; box-shadow: inset 0 0 0 2px #22c55e; }
        .day-number { font-weight: 600; font-size: 0.85rem; margin-bottom: 2px; }
        .appointment-badge { padding: 2px 6px; border-radius: 4px; color: white; font-size: 0.75rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
        .appointment-badge.josefb { background-color: var(--josefb); }
        .appointment-badge.heidi { background-color: var(--heidi); }
        .appointment-badge.josefr { background-color: var(--josefr); }
        .appointment-badge.markus { background-color: var(--markus); }
        .appointment-badge.alle { background-color: var(--alle); }
        .shopping-badge { background: #64748b !important; border-left: 4px solid var(--primary); font-style: italic; animation: pulse 2s infinite alternate; }
        .shopping-badge.josefb { border-left-color: var(--josefb); }
        .shopping-badge.heidi { border-left-color: var(--heidi); }
        .shopping-badge.josefr { border-left-color: var(--josefr); }
        .shopping-badge.markus { border-left-color: var(--markus); }
        .shopping-badge.alle { border-left-color: var(--alle); }
        .shopping-list-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95rem; }
        .shopping-list-table th, .shopping-list-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        .shopping-list-table th { background: #f1f5f9; font-weight: 600; }
        .person-dot { inline-size: 8px; block-size: 8px; display: inline-block; border-radius: 50%; margin-right: 6px; }
        .highlighted-row { animation: highlight-flash 2.5s ease-out; }
        @keyframes highlight-flash { 0% { background-color: #fef08a; } 100% { background-color: transparent; } }
    </style>
</head>
<body>

<div class="container">
    <div class="card full-width">
        <h3>Familienplaner Christ - Online-Modus</h3>
        <div class="calendar-controls">
            <div class="nav-buttons">
                <button class="nav-btn" onclick="navigateCalendar(-1)">Zurück</button>
                <button class="nav-btn" onclick="setCalendarToToday()">Heute</button>
                <button class="nav-btn" onclick="navigateCalendar(1)">Vor</button>
            </div>
            <h2 id="calendar-title">Oktober 2026</h2>
            <div class="view-switch">
                <button class="view-btn active" id="view-monat" onclick="switchView('monat')">Monat</button>
                <button class="view-btn" id="view-woche" onclick="switchView('woche')">Woche</button>
            </div>
        </div>
        
        <div class="calendar-grid">
            <div class="grid-header">
                <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
            </div>
            <div class="grid-body" id="calendar-body"></div>
        </div>
    </div>

    <div class="card">
        <h4>Neuen Termin eintragen</h4>
        <form id="appointment-form" onsubmit="saveAppointment(event)">
            <div class="form-group">
                <label for="app-title">Titel / Beschreibung</label>
                <input type="text" id="app-title" required placeholder="z.B. Zahnarzt, Meeting">
            </div>
            <div class="form-group">
                <label for="app-start-date">Beginn-Datum</label>
                <input type="date" id="app-start-date" required>
            </div>
            <div class="form-group">
                <label for="app-end-date">Ende-Datum</label>
                <input type="date" id="app-end-date" required>
            </div>
            <div class="form-group">
                <label>Uhrzeit Beginn</label>
                <div class="time-row">
                    <select id="app-start-hour" class="time-select"></select>
                    <div class="minute-buttons" id="start-minutes">
                        <button type="button" class="minute-btn active" onclick="selectMinute('start', '00', this)">00</button>
                        <button type="button" class="minute-btn" onclick="selectMinute('start', '15', this)">15</button>
                        <button type="button" class="minute-btn" onclick="selectMinute('start', '30', this)">30</button>
                        <button type="button" class="minute-btn" onclick="selectMinute('start', '45', this)">45</button>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Uhrzeit Ende</label>
                <div class="time-row">
                    <select id="app-end-hour" class="time-select"></select>
                    <div class="minute-buttons" id="end-minutes">
                        <button type="button" class="minute-btn active" onclick="selectMinute('end', '00', this)">00</button>
                        <button type="button" class="minute-btn" onclick="selectMinute('end', '15', this)">15</button>
                        <button type="button" class="minute-btn" onclick="selectMinute('end', '30', this)">30</button>
                        <button type="button" class="minute-btn" onclick="selectMinute('end', '45', this)">45</button>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="app-person">Zugeordnet für:</label>
                <select id="app-person">
                    <option value="josefb">Josef B.</option>
                    <option value="heidi">Heidi</option>
                    <option value="josefr">Josef R.</option>
                    <option value="markus">Markus</option>
                    <option value="alle">Alle</option>
                </select>
            </div>
            <div class="form-group">
                <label for="app-reminder">Standard-Erinnerung</label>
                <select id="app-reminder">
                    <option>Keine Erinnerung</option>
                    <option>15 Minuten vorher</option>
                    <option>30 Minuten vorher</option>
                    <option>1 Stunde vorher</option>
                    <option>1 Tag vorher</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Termin sichern</button>
        </form>
    </div>

    <div class="card" id="shopping-card">
        <h4>Artikel erfassen (Einkaufsliste)</h4>
        <form id="shopping-form" onsubmit="saveShoppingItem(event)">
            <div class="form-group">
                <label for="shop-title">Artikelname / Beschreibung</label>
                <input type="text" id="shop-title" required placeholder="z.B. Milch, Brot, Batterien">
            </div>
            <div class="form-group">
                <label for="shop-date">Datum für den Einkauf</label>
                <input type="date" id="shop-date" required>
            </div>
            <div class="form-group">
                <label for="shop-person">Zugeordnet für:</label>
                <select id="shop-person">
                    <option value="josefb">Josef B.</option>
                    <option value="heidi">Heidi</option>
                    <option value="josefr">Josef R.</option>
                    <option value="markus">Markus</option>
                    <option value="alle">Alle</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Artikel hinzufügen</button>
        </form>

        <h4 style="margin-top: 25px;">Aktuelle Einkaufsliste</h4>
        <table class="shopping-list-table">
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Artikel</th>
                    <th>Für wen</th>
                    <th>Aktion</th>
                </tr>
            </thead>
            <tbody id="shopping-list-body">
                <tr><td colspan="4" style="text-align: center; color: #94a3b8;">Keine Artikel auf der Liste</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const PERSON_NAMES = { josefb: 'Josef B.', heidi: 'Heidi', josefr: 'Josef R.', markus: 'Markus', alle: 'Alle' };
    let currentDate = new Date(2026, 9, 28); // 28. Oktober 2026
    let selectedDate = new Date(2026, 9, 28);
    let currentView = 'monat';

    let selectedStartMinute = '00';
    let selectedEndMinute = '00';

    let appointments = [
        { id: 1, title: 'Zahnarzt', startDate: '2026-10-28', endDate: '2026-10-28', startHour: '10', startMinute: '15', endHour: '11', endMinute: '00', person: 'josefb', isShopping: false }
    ];
    let shoppingItems = [];

    window.onload = function() {
        initTimeDropdowns();
        updateFormDates(selectedDate);
        renderCalendar();
    };

    function initTimeDropdowns() {
        const startHourSelect = document.getElementById('app-start-hour');
        const endHourSelect = document.getElementById('app-end-hour');
        for (let i = 0; i < 24; i++) {
            let hr = i < 10 ? '0' + i : i;
            startHourSelect.options.add(new Option(hr, hr));
            endHourSelect.options.add(new Option(hr, hr));
        }
    }

    function formatDateIso(date) {
        let d = new Date(date);
        let month = '' + (d.getMonth() + 1);
        let day = '' + d.getDate();
        let year = d.getFullYear();
        if (month.length < 2) month = '0' + month;
        if (day.length < 2) day = '0' + day;
        return [year, month, day].join('-');
    }

    function updateFormDates(date) {
        const dateStr = formatDateIso(date);
        document.getElementById('app-start-date').value = dateStr;
        document.getElementById('app-end-date').value = dateStr;
        document.getElementById('shop-date').value = dateStr;
    }

    document.getElementById('app-start-date').addEventListener('change', function(e) {
        document.getElementById('app-end-date').value = e.target.value;
    });

    function selectMinute(type, val, btn) {
        const parent = btn.parentElement;
        parent.querySelectorAll('.minute-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (type === 'start') selectedStartMinute = val;
        if (type === 'end') selectedEndMinute = val;
    }

    function switchView(view) {
        currentView = view;
        document.getElementById('view-monat').classList.toggle('active', view === 'monat');
        document.getElementById('view-woche').classList.toggle('active', view === 'woche');
        renderCalendar();
    }

    function setCalendarToToday() {
        currentDate = new Date(2026, 9, 28);
        selectedDate = new Date(2026, 9, 28);
        updateFormDates(selectedDate);
        renderCalendar();
    }

    function navigateCalendar(direction) {
        if (currentView === 'monat') {
            currentDate.setMonth(currentDate.getMonth() + direction);
        } else {
            currentDate.setDate(currentDate.getDate() + (direction * 7));
        }
        renderCalendar();
    }

    function selectDay(date) {
        selectedDate = new Date(date);
        updateFormDates(selectedDate);
        renderCalendar();
    }

    function renderCalendar() {
        const body = document.getElementById('calendar-body');
        const title = document.getElementById('calendar-title');
        body.innerHTML = '';

        if (currentView === 'monat') {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
            title.innerText = `${monthNames[month]} ${year}`;

            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1; // Anpassung Montag als 1. Tag
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            // Tage aus dem Vormonat rendern
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayDate = new Date(year, month - 1, daysInPrevMonth - i);
                createDayCell(dayDate, true, body);
            }
            // Tage des aktuellen Monats rendern
            for (let i = 1; i <= daysInMonth; i++) {
                const dayDate = new Date(year, month, i);
                createDayCell(dayDate, false, body);
            }
            // Tage des Folgemonats auffüllen für komplettes 6-Wochen-Raster
            const totalCells = 42;
            const currentCells = firstDayIndex + daysInMonth;
            for (let i = 1; i <= (totalCells - currentCells); i++) {
                const dayDate = new Date(year, month + 1, i);
                createDayCell(dayDate, true, body);
            }
        } else {
            // Wochenansicht
            let dayOfWeek = currentDate.getDay();
            dayOfWeek = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
            let startOfWeek = new Date(currentDate);
            startOfWeek.setDate(currentDate.getDate() - dayOfWeek);

            let endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);

            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            title.innerText = `KW ${getWeekNumber(startOfWeek)} (${startOfWeek.toLocaleDateString('de-DE', {day:'numeric', month:'short'})} - ${endOfWeek.toLocaleDateString('de-DE', options)})`;

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(startOfWeek);
                dayDate.setDate(startOfWeek.getDate() + i);
                createDayCell(dayDate, false, body);
            }
        }
    }

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
        return weekNo;
    }

    function createDayCell(date, isOtherMonth, container) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day';
        if (isOtherMonth) cell.classList.add('other-month');
        
        const today = new Date(2026, 9, 28);
        if (date.toDateString() === today.toDateString()) cell.classList.add('today');
        if (date.toDateString() === selectedDate.toDateString()) cell.classList.add('selected');

        cell.onclick = function(e) {
            if (e.target.classList.contains('appointment-badge')) return;
            selectDay(date);
        };

        const numDiv = document.createElement('div');
        numDiv.className = 'day-number';
        numDiv.innerText = date.getDate();
        cell.appendChild(numDiv);

        const dateStr = formatDateIso(date);
        
        // Normale Termine filtern und rendern
        const dayApps = appointments.filter(a => a.startDate <= dateStr && a.endDate >= dateStr);
        dayApps.forEach(app => {
            const badge = document.createElement('div');
            badge.className = `appointment-badge ${app.person}`;
            badge.innerText = `${app.startHour}:${app.startMinute} ${app.title}`;
            badge.title = app.title;
            cell.appendChild(badge);
        });

        // Einkäufe für diesen Tag prüfen
        const dayShoppingItems = shoppingItems.filter(item => item.date === dateStr);
        if (dayShoppingItems.length > 0) {
            // Gruppieren nach Person für separate "Einkauf"-Einträge
            const personsWithShopping = [...new Set(dayShoppingItems.map(item => item.person))];
            personsWithShopping.forEach(p => {
                const badge = document.createElement('div');
                badge.className = `appointment-badge ${p} shopping-badge`;
                badge.innerText = `🛒 Einkauf`;
                badge.title = `Klicken, um Einkaufsliste für ${PERSON_NAMES[p]} zu öffnen`;
                badge.onclick = function(e) {
                    e.stopPropagation();
                    focusAndHighlightShoppingList(dateStr, p);
                };
                cell.appendChild(badge);
            });
        }

        container.appendChild(cell);
    }

    function saveAppointment(e) {
        e.preventDefault();
        const title = document.getElementById('app-title').value;
        const startDate = document.getElementById('app-start-date').value;
        const endDate = document.getElementById('app-end-date').value;
        const startHour = document.getElementById('app-start-hour').value;
        const endHour = document.getElementById('app-end-hour').value;
        const person = document.getElementById('app-person').value;

        appointments.push({
            id: Date.now(),
            title: title,
            startDate: startDate,
            endDate: endDate,
            startHour: startHour,
            startMinute: selectedStartMinute,
            endHour: endHour,
            endMinute: selectedEndMinute,
            person: person
        });

        document.getElementById('app-title').value = '';
        renderCalendar();
    }

    function saveShoppingItem(e) {
        e.preventDefault();
        const title = document.getElementById('shop-title').value;
        const date = document.getElementById('shop-date').value;
        const person = document.getElementById('shop-person').value;

        shoppingItems.push({
            id: Date.now(),
            title: title,
            date: date,
            person: person
        });

        document.getElementById('shop-title').value = '';
        renderShoppingList();
        renderCalendar();
    }

    function deleteShoppingItem(id) {
        shoppingItems = shoppingItems.filter(item => item.id !== id);
        renderShoppingList();
        renderCalendar();
    }

    function renderShoppingList() {
        const body = document.getElementById('shopping-list-body');
        body.innerHTML = '';

        if (shoppingItems.length === 0) {
            body.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8;">Keine Artikel auf der Liste</td></tr>`;
            return;
        }

        // Sortieren nach Datum
        shoppingItems.sort((a, b) => new Date(a.date) - new Date(b.date));

        shoppingItems.forEach(item => {
            const tr = document.createElement('tr');
            tr.id = `shop-item-${item.id}`;
            
            // Formatieren des Datums für die Anzeige
            const dateObj = new Date(item.date);
            const formattedDate = dateObj.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

            tr.innerHTML = `
                <td>${formattedDate}</td>
                <td><strong>${item.title}</strong></td>
                <td><span class="person-dot ${item.person}" style="background-color: var(--${item.person})"></span>${PERSON_NAMES[item.person]}</td>
                <td><button class="btn btn-danger" onclick="deleteShoppingItem(${item.id})">Erledigt</button></td>
            `;
            body.appendChild(tr);
        });
    }

    function focusAndHighlightShoppingList(dateStr, person) {
        // Scrollt zur Einkaufslisten-Karte
        const shoppingCard = document.getElementById('shopping-card');
        shoppingCard.scrollIntoView({ behavior: 'smooth' });

        // Aktualisiert die Anzeige der Einkaufsliste
        renderShoppingList();

        // Hebt alle zutreffenden Zeilen temporär farblich hervor
        shoppingItems.forEach(item => {
            if (item.date === dateStr && item.person === person) {
                const tr = document.getElementById(`shop-item-${item.id}`);
                if (tr) {
                    tr.classList.remove('highlighted-row');
                    void tr.offsetWidth; // Trigger Reflow für Neustart der CSS-Animation
                    tr.classList.add('highlighted-row');
                }
            }
        });
    }
</script>

</body>
</html>
